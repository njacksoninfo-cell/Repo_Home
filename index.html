<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Dallas Kit Ranker</title>
    <link rel="stylesheet" href="style.css">
    <script src="kitinfo.js"></script>
    <script src="kitimages.js"></script>
    <script src="script.js"></script>
</head>
<body>

    <!-- MODE SELECT SCREEN -->
    <div id="modeSelect">
        <svg class="shield-bg" viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
            <path d="M100 10 L190 50 L190 140 Q190 200 100 230 Q10 200 10 140 L10 50 Z"
                  fill="none" stroke="rgba(232,31,62,0.07)" stroke-width="3"/>
            <path d="M100 30 L170 60 L170 130 Q170 185 100 210 Q30 185 30 130 L30 60 Z"
                  fill="none" stroke="rgba(232,31,62,0.04)" stroke-width="2"/>
        </svg>
        <div class="mode-header">
            <h1>FC DALLAS</h1>
            <h2>KIT RANKER</h2>
            <div class="brand-divider"></div>
            <p class="mode-subtitle">Compare kits head-to-head to build your ultimate ranking</p>
        </div>
        <div class="speed-toggle">
            <button class="speed-btn active" id="speedQuick" onclick="setSpeed('quick')">Quick Rank</button>
            <button class="speed-btn" id="speedFull" onclick="setSpeed('full')">Full Rank</button>
        </div>
        <div class="mode-buttons">
            <button class="mode-btn home-btn" onclick="startRanking('home')">
                <span class="mode-btn-icon">&#127968;</span>
                <span class="mode-btn-label">Home Kits</span>
                <span class="mode-btn-count" id="homeCount"></span>
            </button>
            <button class="mode-btn away-btn" onclick="startRanking('away')">
                <span class="mode-btn-icon">&#9992;</span>
                <span class="mode-btn-label">Away Kits</span>
                <span class="mode-btn-count" id="awayCount"></span>
            </button>
            <button class="mode-btn third-btn" onclick="startRanking('third')">
                <span class="mode-btn-icon">&#9733;</span>
                <span class="mode-btn-label">Third Kits</span>
                <span class="mode-btn-count" id="thirdCount"></span>
            </button>
            <button class="mode-btn all-btn" onclick="startRanking('all')">
                <span class="mode-btn-icon">&#127760;</span>
                <span class="mode-btn-label">All Kits</span>
                <span class="mode-btn-count" id="allCount"></span>
            </button>
        </div>
        <p class="mode-footer">Pick a mode to start ranking. You'll compare two kits at a time.</p>
    </div>

    <!-- COMPARISON SCREEN -->
    <div id="battleScreen" style="display:none;">
        <div class="battle-header">
            <button class="back-btn" onclick="goBack()">&#8592; Back</button>
            <div id="matchupNumber" class="matchup-info"></div>
        </div>
        <div class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
        <div class="battle-instruction">Tap the kit you prefer</div>
        <div id="mainTable" class="battle-area">
            <div id="leftField" class="kit-card" onclick="makeChoice(-1)"></div>
            <div class="vs-divider">VS</div>
            <div id="rightField" class="kit-card" onclick="makeChoice(1)"></div>
        </div>
        <div class="battle-actions">
            <button class="undo-btn" onclick="undoLast()">&#8634; Undo</button>
        </div>
    </div>

    <!-- LOADING OVERLAY -->
    <div id="loadingOverlay" style="display:none;">
        <div class="loader-content">
            <div class="spinner"></div>
            <p>Generating your ranking...</p>
        </div>
    </div>

</body>
</html>
